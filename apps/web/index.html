<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>battle · command desk</title>
<link rel="stylesheet" href="/style.css">
<script src="/poc/feature-sources.js"></script>
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<header class="desk-header">
  <div><span id="campaign"></span><h1 id="title">Command desk</h1></div>
  <div class="scenario-choice">
    <label for="scenario-select">Scenario</label>
    <select id="scenario-select" disabled></select>
    <button id="new-battle" disabled>Start battle</button>
  </div>
  <div class="battle-clock" aria-live="polite">
    <strong id="battle-time">--:--</strong>
    <span id="battle-date"></span>
    <span id="battle-location"></span>
  </div>
</header>
<main class="desk">
  <section class="field">
    <svg id="map" role="img" aria-label="Hex map of the battlefield"></svg>
    <p id="notice" class="notice" role="status" data-kind="info">Connecting to the local simulation…</p>
  </section>
  <aside class="panel">
    <section>
      <h2>Selected</h2>
      <p id="selection">Select one of your counters on the map.</p>
      <div id="unit-card" class="unit-card"></div>
      <label for="order-kind">Order</label>
      <select id="order-kind" disabled></select>
      <div id="order-help" class="order-help"></div>
      <button id="send-order" disabled>Send order</button>
      <button id="clock-toggle" disabled>Start clock</button>
    </section>
    <section><h2>Orders</h2><ol id="orders"></ol></section>
    <section><h2>Dispatches</h2><ol id="dispatches" class="dispatches"></ol></section>
    <section><h2>Enemy sightings</h2><ul id="contacts"></ul></section>
    <section><h2>Mission</h2><div id="mission"></div></section>
  </aside>
</main>
</body>
</html>
